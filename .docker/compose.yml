services:
  database:
    container_name: app_db
    image: postgres
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_SCHEMA_NAME}
    ports:
      - "5432:${DB_HOST_PORT}"
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/
    networks:
      - app
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

networks:
  app:
    driver: bridge

volumes:
  db_data:
    driver: local